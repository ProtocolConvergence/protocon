---
name: Bazel
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]

    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Cache Setup
      uses: actions/cache@v6
      id: cache-bazel
      with:
        path: ~/.cache/bazel
        key: ${{ runner.os }}-bazel

    - name: Setup bazel
      uses: jwlawson/actions-setup-bazel@v2
      with:
        bazel-version: latest

    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      run: >
        bazel build
        --config=standard_test_platform
        //...

    - name: Test
      # --enable_runfiles is for Windows tests to access data deps.
      run: >
        bazel test
        --config=standard_test_platform
        --enable_runfiles
        --test_timeout 300
        //...

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: bazel-testlogs-(${{ matrix.platform }})
        path: bazel-testlogs*/**/*


  coverage:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
    - name: Setup bazel
      uses: jwlawson/actions-setup-bazel@v2
      with:
        bazel-version: latest

    - name: Checkout
      uses: actions/checkout@v7

    - name: Run tests
      run: >
        bazel coverage
        --instrument_test_targets
        --instrumentation_filter="^//..."
        --combined_report=lcov
        --
        //...

    - name: Strip Branch Coverage
      # Bazel 7 generates branch coverage, but we prefer line coverage reports.
      run: sed -i '/^BR/d' bazel-out/_coverage/_coverage_report.dat

    - name: Coveralls
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: bazel-out/_coverage/_coverage_report.dat
